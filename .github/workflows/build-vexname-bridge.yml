name: Build VexName Bridge

on:
  push:
    branches: [vexname-bridge]
  pull_request:
    branches: [main]
    paths:
      - 'vexname-bridge/**'
      - '.github/workflows/build-vexname-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vexname-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --refresh-dependencies

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: vexname-bridge
          path: vexname-bridge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
